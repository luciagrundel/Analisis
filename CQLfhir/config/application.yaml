spring:
  datasource:
    url: jdbc:h2:mem:cql_demo;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      hibernate:
        dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirH2Dialect
        search:
          enabled: false
hapi:
  fhir:
    fhir_version: R4
    cr:
      enabled: true
      cql:
        use_embedded_libraries: true
