server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/hapi
    username: hapi
    password: hapi
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
        hbm2ddl.auto: update
        search.enabled: false

hapi:
  fhir:
    fhir_version: R4
    openapi_enabled: true
    mdm_enabled: true
    # Recurso del classpath, montado por Compose en /app/extra-classes.
    mdm_rules_json_location: mpi-mdm-rules.json
    subscription:
      resthook_enabled: false
      websocket_enabled: true
    cors:
      allow_Credentials: false
      allowed_origin:
        - "http://localhost:5173"
      allowed_header:
        - "*"
      allowed_method:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "OPTIONS"
